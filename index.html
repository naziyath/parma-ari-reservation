<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parma Ari — Reserve a Table</title>
<style>
:root{--green:#24352d;--cream:#f8f5ef;--line:#ded9cf;--muted:#77736c}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:var(--green)}.wrap{max-width:520px;margin:auto;padding:28px 18px 40px}.brand{text-align:center;letter-spacing:.18em;font-size:12px;font-weight:700}h1{text-align:center;font-family:Georgia,serif;font-size:30px;margin:10px 0 5px}.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}label{display:block;font-size:14px;font-weight:700;margin:22px 0 10px}.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 15px;min-width:78px;font-weight:600;color:var(--green);cursor:pointer}.btn.active{background:var(--green);color:#fff;border-color:var(--green)}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.times .btn{min-width:0}.guest{display:flex;align-items:center;gap:18px}.round{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:22px;cursor:pointer}.count{font-weight:700;min-width:90px;text-align:center}.summary{border-top:1px solid var(--line);margin-top:28px;padding-top:18px}.summary div{display:flex;justify-content:space-between;margin:9px 0;font-size:14px}.summary span{color:var(--muted)}.cta{width:100%;margin-top:18px;border:0;border-radius:12px;padding:16px;background:#06c755;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.cta:disabled{opacity:.45;cursor:not-allowed}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}.phone{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}.nameinput,.phoneinput{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:15px;color:var(--green)}.phoneinput:focus{outline:none;border-color:var(--green)}.phone a{display:inline-block;margin-top:6px;color:var(--green);font-weight:700;text-decoration:none}
 .logo{width:210px;height:auto;display:block;margin:0 auto 10px}.logo img{width:100%;height:auto;display:block}</style></head><body><div class="wrap"><div class="logo" aria-label="Parma Trattoria Ari logo"><svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" role="img">
<g fill="none" stroke="#40527f" stroke-width="3">
<path d="M42 62V22H478V62"/><path d="M55 75V35H465V75"/>
<path d="M42 298V338H478V298"/><path d="M55 285V325H465V285"/>
<path d="M115 313H175"/><path d="M345 313H405"/>
</g>
<g fill="#758c4b" stroke="#758c4b" stroke-width="1">
<path d="M112 304C75 270 63 220 78 165C91 215 112 257 145 290Z"/>
<path d="M92 263C65 243 55 211 60 182C80 204 94 230 104 255Z"/>
<path d="M84 226C65 209 61 184 66 160C81 178 89 199 94 217Z"/>
<path d="M408 304C445 270 457 220 442 165C429 215 408 257 375 290Z"/>
<path d="M428 263C455 243 465 211 460 182C440 204 426 230 416 255Z"/>
<path d="M436 226C455 209 459 184 454 160C439 178 431 199 426 217Z"/>
</g>
<text x="260" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="72" letter-spacing="4" fill="#7e3438">PARMA</text>
<line x1="125" y1="163" x2="395" y2="163" stroke="#7e3438" stroke-width="2"/>
<text x="260" y="220" text-anchor="middle" font-family="Georgia,serif" font-size="42" letter-spacing="5" fill="#40527f">TRATTORIA</text>
<text x="260" y="326" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#7e3438">ARI</text>
</svg></div><div class="brand">TRATTORIA PARMA ARI</div><h1>Reserve Your Table</h1><div class="sub">Choose your date, time and number of guests.</div><label>Choose date</label><div class="row" id="dates"></div><label>Choose time</label><div class="times" id="times"></div><label>Guests</label><div class="guest"><button class="round" id="minus">−</button><div class="count"><span id="guests">2</span> Guests</div><button class="round" id="plus">+</button></div><label>Name</label><input class="nameinput" id="customerName" type="text" autocomplete="name" placeholder="e.g. John"><label>Contact phone number</label><input class="phoneinput" id="customerPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 081-234-5678"><div class="summary"><div><span>Date</span><b id="sdate">23 Sep 2026</b></div><div><span>Time</span><b id="stime">Please select</b></div><div><span>Guests</span><b id="sguests">2</b></div><div><span>Name</span><b id="sname">Please enter</b></div><div><span>Phone</span><b id="sphone">Please enter</b></div></div><button class="cta" id="line" disabled>Continue with LINE</button><div class="note">Reservation request will be confirmed by Parma Ari via LINE OA.</div><div class="phone">Need help with your reservation?<br><a href="tel:0822949292">📞 Call Parma Ari: 082-294-9292</a></div></div>
<script>
const dates=["23 Sep 2026","24 Sep 2026","25 Sep 2026","26 Sep 2026","27 Sep 2026"],times=["12:00","12:30","13:00","13:30","14:00","14:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30"];let date=dates[0],time="",guests=2;
const datesEl=document.getElementById("dates"),timesEl=document.getElementById("times");dates.forEach((d,i)=>{let b=document.createElement("button");b.className="btn"+(i===0?" active":"");b.textContent=d.replace(" 2026","");b.onclick=()=>{date=d;document.querySelectorAll("#dates .btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");update()};datesEl.appendChild(b)});times.forEach(t=>{let b=document.createElement("button");b.className="btn";b.textContent=t;b.onclick=()=>{time=t;document.querySelectorAll("#times .btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");update()};timesEl.appendChild(b)});document.getElementById("minus").onclick=()=>{if(guests>1){guests--;update()}};document.getElementById("plus").onclick=()=>{if(guests<20){guests++;update()}};function update(){const name=document.getElementById("customerName").value.trim();const phone=document.getElementById("customerPhone").value.trim();document.getElementById("sdate").textContent=date;document.getElementById("stime").textContent=time||"Please select";document.getElementById("guests").textContent=guests;document.getElementById("sguests").textContent=guests;document.getElementById("sname").textContent=name||"Please enter";document.getElementById("sphone").textContent=phone||"Please enter";document.getElementById("line").disabled=!(time&&name&&phone)}document.getElementById("customerName").addEventListener("input",update);document.getElementById("customerPhone").addEventListener("input",update);document.getElementById("line").onclick=()=>{if(!time)return;const name=document.getElementById("customerName").value.trim();const phone=document.getElementById("customerPhone").value.trim();if(!name||!phone)return;const message=`Reservation request\nName: ${name}\nDate: ${date}\nTime: ${time}\nGuests: ${guests}\nPhone: ${phone}`;const lineUrl="https://line.me/R/oaMessage/%40parma.ari/?"+encodeURIComponent(message);window.location.href=lineUrl};update();
</script></body></html>
